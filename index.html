<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Women Entrepreneur Network (WEN) | Connect • Learn • Grow</title>
  <meta name="description" content="A modern digital platform empowering women entrepreneurs to connect with mentors, discover funding opportunities, showcase storefront products, and scale sustainable businesses." />
  
  <!-- Favicon SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%237C3AED'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='42' font-weight='900' fill='white' font-family='sans-serif'>WEN</text></svg>" />

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN with Custom Brand Theme -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            heading: ['Outfit', '"Plus Jakarta Sans"', 'sans-serif']
          },
          colors: {
            wenPurple: {
              50: '#FAF5FF',
              100: '#F3E8FF',
              200: '#E9D5FF',
              500: '#A855F7',
              600: '#9333EA',
              700: '#7C3AED',
              800: '#6B21A8',
              900: '#581C87',
              950: '#3B0764'
            },
            wenPink: {
              50: '#FDF2F8',
              100: '#FCE7F3',
              500: '#EC4899',
              600: '#DB2777',
              700: '#BE185D'
            },
            wenSky: {
              50: '#F0F9FF',
              100: '#E0F2FE',
              600: '#0284C7',
              700: '#0369A1'
            }
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-[#FAFAFA] text-slate-900 min-h-screen flex flex-col antialiased selection:bg-purple-100 selection:text-purple-800">
  
  <!-- Root SPA Mounting Point -->
  <div id="app" class="flex flex-col min-h-screen">
    <!-- View Rendered Dynamically by App Controller -->
    <div class="flex items-center justify-center min-h-screen">
      <div class="text-center space-y-3">
        <div class="w-12 h-12 border-4 border-purple-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">Loading Women Entrepreneur Network...</p>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs (Compat version for client-side analytics & services) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
  <script src="js/firebaseInit.js"></script>

  <!-- Component Scripts -->
  <script src="js/data.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/components/footer.js"></script>
  <script src="js/components/home.js"></script>
  <script src="js/components/about.js"></script>
  <script src="js/components/mentors.js"></script>
  <script src="js/components/funding.js"></script>
  <script src="js/components/marketplace.js"></script>
  <script src="js/components/community.js"></script>
  <script src="js/components/events.js"></script>
  <script src="js/components/resources.js"></script>
  <script src="js/components/pricing.js"></script>
  <script src="js/components/dashboard.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
